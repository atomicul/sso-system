---
- name: Wait until the app is healthy
  ansible.builtin.uri:
    url: >-
      {{ 'https://127.0.0.1:' ~ sso_https_port if sso_https_certificate.stat.exists
         else 'http://127.0.0.1:' ~ sso_port }}/health
    validate_certs: false
  register: sso_health
  until: sso_health.status == 200
  retries: 30
  delay: 2
