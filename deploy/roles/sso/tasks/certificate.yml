---
- name: Ask where the Data Protection certificate comes from
  ansible.builtin.pause:
    prompt: >-
      {{ 'Replacing the installed certificate logs every user out. ' if sso_certificate_env.stat.exists else '' -}}
      Data Protection certificate: press Enter to generate a new one, or type the local path of an existing PFX
  register: sso_certificate_source

- name: Remember whether to generate the certificate
  ansible.builtin.set_fact:
    sso_generate_certificate: "{{ sso_certificate_source.user_input | length == 0 }}"

- name: Ask where to keep the generated certificate
  ansible.builtin.pause:
    prompt: Local path to save the new PFX to, as its backup [{{ sso_default_certificate_path }}]
  register: sso_certificate_output
  when: sso_generate_certificate

- name: Remember the certificate's local path
  ansible.builtin.set_fact:
    sso_certificate_file: >-
      {{ [sso_controller_directory, sso_chosen_certificate_path | ansible.builtin.expanduser]
         | ansible.builtin.path_join }}
  vars:
    sso_chosen_certificate_path: >-
      {{ sso_certificate_source.user_input
         or sso_certificate_output.user_input | default('')
         or sso_default_certificate_path }}

- name: Look for the certificate's local path
  ansible.builtin.stat:
    path: "{{ sso_certificate_file }}"
  delegate_to: localhost
  become: false
  register: sso_certificate_file_stat

- name: Require the PFX to exist, or its new path to be free
  ansible.builtin.assert:
    that: sso_certificate_file_stat.stat.exists != sso_generate_certificate
    fail_msg: >-
      {{ sso_certificate_file }}
      {{ 'already exists; pass a new path to generate a certificate' if sso_generate_certificate
         else "doesn't exist" }}
    quiet: true

- name: Ask for the certificate's password
  ansible.builtin.pause:
    prompt: "{{ 'Password for the new PFX' if sso_generate_certificate else 'Password of the PFX' }}"
    echo: false
  register: sso_certificate_password

- name: Ask for the new certificate's password again
  ansible.builtin.pause:
    prompt: Repeat the password
    echo: false
  register: sso_certificate_password_again
  when: sso_generate_certificate

- name: Require a certificate password, typed the same way twice for a new one
  ansible.builtin.assert:
    that:
      - sso_certificate_password.user_input | length > 0
      - not sso_generate_certificate or sso_certificate_password_again.user_input == sso_certificate_password.user_input
    fail_msg: The certificate password is empty, or the two passwords don't match
    quiet: true
  no_log: true

- name: Generate the certificate
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python | dirname }}/generate-certificate"
      - "{{ sso_certificate_file }}"
  environment:
    SSO_CERTIFICATE_PASSWORD: "{{ sso_certificate_password.user_input }}"
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  when: sso_generate_certificate

- name: Copy the certificate to the host
  ansible.builtin.copy:
    src: "{{ sso_certificate_file }}"
    dest: "{{ sso_config_dir }}/dataprotection.pfx"
    owner: root
    group: sso
    mode: "0640"
  notify: Restart the app

- name: Write the certificate settings
  ansible.builtin.template:
    src: certificate.env.j2
    dest: "{{ sso_config_dir }}/certificate.env"
    mode: "0600"
  no_log: true
  notify: Restart the app
