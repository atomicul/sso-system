---
sso_change_database_password: false
sso_change_certificate: false
sso_change_signing_key: false
sso_client_apps_source: ""
sso_controller_directory: "{{ lookup('ansible.builtin.env', 'PWD') }}"
sso_default_certificate_path: "{{ inventory_hostname }}-dataprotection.pfx"
sso_default_signing_key_path: "{{ inventory_hostname }}-sso-signing.pem"
